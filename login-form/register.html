<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link href="style.css" rel="stylesheet">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <script src="script.js" defer></script>
</head>
<body>

<body class="">

	<form class="form">

		<h1 class="form__title">Register page</h1>

		<div class="form__input-box">
			<label class="form__label" for="login">Username</label>
			<input class="form__input" id="login" type="text" name="login" placeholder="Your username" />
		</div>

		<div class="form__input-box">
			<label class="form__label" for="password">Password</label>
			<input class="form__input" id="password" type="password" name="password" placeholder='••••••••••••' />
		</div>

		<div class="form__input-box">
			<label class="form__label" for="email">Email</label>
			<input class="form__input" id="email" type="email" name="email" placeholder='Your email' />
		</div>

		<div class="form__input-box">
			<input class="form__input" type="submit" name="" value="Register" />
		</div>

    <p class="form__forget-password">Already have an account ? <a class="form__forget-password-link" href="login.html">Click Here</a></p>

	</form>

</body>

</body>
</html>
